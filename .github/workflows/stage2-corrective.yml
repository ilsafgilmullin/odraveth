name: Stage 2+3 regression audit

on:
  push:
    branches:
      - claude/odraveth-stage2-match-engine
      - claude/odraveth-stage3-ai
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clean checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fsSL "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o .tools/godot.zip
          curl -fsSL "$base/SHA512-SUMS.txt" -o .tools/SHA512-SUMS.txt
          (
            cd .tools
            grep "Godot_v4.7.2-stable_linux.x86_64.zip" SHA512-SUMS.txt | sed 's#Godot_v4.7.2-stable_linux.x86_64.zip#godot.zip#' | sha512sum -c -
            unzip -q godot.zip
            chmod +x Godot_v4.7.2-stable_linux.x86_64
          )
          .tools/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Full regression
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$PWD/.tools/Godot_v4.7.2-stable_linux.x86_64" tests/run_tests.sh | tee stage2-baseline.log

      - name: Targeted mutation tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$PWD/.tools/Godot_v4.7.2-stable_linux.x86_64"

          expect_failure() {
            local name="$1"
            local log=".tools/mutation-${name}.log"
            set +e
            GODOT_BIN="$GODOT" tests/run_tests.sh >"$log" 2>&1
            local code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo "MUTATION SURVIVED: $name"
              cat "$log"
              exit 1
            fi
            echo "MUTATION CAUGHT: $name (exit $code)"
            grep -E "FAILED|failed|ERROR|SCRIPT ERROR|Parse Error|SMOKE TEST" "$log" | tail -40 || true
          }

          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/battle/command_validator.gd")
          s = p.read_text()
          old = """\tvar targets := TargetRules.chosen_targets(state, command.player, kind)
          \tif targets.is_empty():
          \t\treturn _error(ActionResult.TARGET_REQUIRED if command.target_id == 0 else ActionResult.INVALID_TARGET,
          \t\t\t\"no valid target for %s\" % kind)"""
          new = """\tvar targets := TargetRules.chosen_targets(state, command.player, kind)
          \tif targets.is_empty():
          \t\tif definition.card_type == CardEnums.Type.CREATURE and command.target_id == 0:
          \t\t\treturn {}
          \t\treturn _error(ActionResult.TARGET_REQUIRED if command.target_id == 0 else ActionResult.INVALID_TARGET,
          \t\t\t\"no valid target for %s\" % kind)"""
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          expect_failure creature-target-bypass
          git checkout -- scripts/battle/command_validator.gd

          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/battle/cost_calculator.gd")
          s = p.read_text()
          old = "\tfor modifier in state.players[player_index].incoming_cost_modifiers:"
          new = """\tvar pending_modifiers := state.players[player_index].incoming_cost_modifiers.duplicate()
          \tpending_modifiers.reverse()
          \tfor modifier in pending_modifiers:"""
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          expect_failure reverse-cost-fifo
          git checkout -- scripts/battle/cost_calculator.gd

          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/battle/cost_calculator.gd")
          s = p.read_text()
          old = """\t\tif modifier[\"source\"] == DISTORTION:
          \t\t\tif distortion_applied:
          \t\t\t\tcontinue
          \t\t\tdistortion_applied = true"""
          new = """\t\tif modifier[\"source\"] == DISTORTION:
          \t\t\tif distortion_applied and modifier.has(\"__never__\"):
          \t\t\t\tcontinue
          \t\t\tdistortion_applied = true"""
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          expect_failure multiple-distortion
          git checkout -- scripts/battle/cost_calculator.gd

          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/battle/cost_calculator.gd")
          s = p.read_text()
          old = """\t\tif only_at_most >= 0 and cost > only_at_most:
          \t\t\tcontinue"""
          new = """\t\tif only_at_most >= 0 and cost > only_at_most:
          \t\t\tconsumed.append(int(modifier[\"seq\"]))
          \t\t\tcontinue"""
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          expect_failure consume-skipped-thoughtscar
          git checkout -- scripts/battle/cost_calculator.gd

          git diff --exit-code


      - name: Stage 3 AI mutation tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$PWD/.tools/Godot_v4.7.2-stable_linux.x86_64"

          expect_failure() {
            local name="$1"
            local log=".tools/ai-mutation-${name}.log"
            set +e
            GODOT_BIN="$GODOT" tests/run_tests.sh >"$log" 2>&1
            local code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo "AI MUTATION SURVIVED: $name"
              cat "$log"
              exit 1
            fi
            echo "AI MUTATION CAUGHT: $name (exit $code)"
            grep -E "FAILED|failed|ERROR|SCRIPT ERROR|Parse Error|SMOKE TEST" "$log" | tail -40 || true
          }

          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/ai/ai_turn_runner.gd")
          s = p.read_text()
          old = """\t\tvar observation := engine.get_observation(player)
          \t\tif observation.is_empty() or observation[\"match_over\"]:"""
          new = """\t\tvar observation := engine.get_observation(player)
          \t\tvar leaked_opponent_card := \"\" if engine.state.players[1 - player].hand.is_empty() else String(engine.state.players[1 - player].hand[0].card_id())
          \t\tif leaked_opponent_card == \"__never__\":
          \t\t\tbreak
          \t\tif observation.is_empty() or observation[\"match_over\"]:"""
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          expect_failure reads-opponent-hand
          git checkout -- scripts/ai/ai_turn_runner.gd

          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/battle/ai_observation_builder.gd")
          s = p.read_text()
          old = """\tif include_hand:
          \t\tvar hand: Array[Dictionary] = []"""
          new = """\tresult[\"deck\"] = player.deck.map(func(card: CardInstance) -> String: return String(card.card_id()))
          \tif include_hand:
          \t\tvar hand: Array[Dictionary] = []"""
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          expect_failure leaks-deck-order
          git checkout -- scripts/battle/ai_observation_builder.gd

          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/ai/ai_controller.gd")
          s = p.read_text()
          old = """\treturn \"%02d|%010d|%010d|%s|%s\" % ["""
          new = """\tvar random_tie := randi()
          \treturn (\"%010d|\" % random_tie) + (\"%02d|%010d|%010d|%s|%s\" % ["""
          assert old in s
          s = s.replace(old, new, 1)
          old_end = """\t\t\",\".join(replace_parts), \";\".join(choice_parts),
          \t]"""
          new_end = """\t\t\",\".join(replace_parts), \";\".join(choice_parts),
          \t])"""
          assert old_end in s
          p.write_text(s.replace(old_end, new_end, 1))
          PY
          expect_failure random-tie-break
          git checkout -- scripts/ai/ai_controller.gd

          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/ai/ai_turn_runner.gd")
          s = p.read_text()
          old = """\t\tif not _contains_command(legal, decision.selected_command):"""
          new = """\t\tif false and not _contains_command(legal, decision.selected_command):"""
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          expect_failure accepts-nonlegal-command
          git checkout -- scripts/ai/ai_turn_runner.gd

          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/ai/ai_turn_runner.gd")
          s = p.read_text()
          old = """\tif int(trace[\"commands_executed\"]) >= max_commands_per_turn:"""
          new = """\tif false and int(trace[\"commands_executed\"]) >= max_commands_per_turn:"""
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          expect_failure removes-turn-guard
          git checkout -- scripts/ai/ai_turn_runner.gd

          git diff --exit-code
