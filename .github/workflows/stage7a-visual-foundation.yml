name: Stage 7A visual foundation

on:
  push:
    branches:
      - claude/odraveth-visual-alpha
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Clean checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fsSL "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o .tools/godot.zip
          curl -fsSL "$base/SHA512-SUMS.txt" -o .tools/SHA512-SUMS.txt
          (
            cd .tools
            grep "Godot_v4.7.2-stable_linux.x86_64.zip" SHA512-SUMS.txt | sed 's#Godot_v4.7.2-stable_linux.x86_64.zip#godot.zip#' | sha512sum -c -
            unzip -q godot.zip
            chmod +x Godot_v4.7.2-stable_linux.x86_64
          )
          .tools/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Fresh asset import
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .godot
          GODOT="$PWD/.tools/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --import 2>&1 | tee stage7a-import.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error|Failed loading resource|Can't open" stage7a-import.log; then
            echo "Fresh import produced resource errors"
            exit 1
          fi
          test -d .godot/imported
          for asset in             assets/ui/visual_alpha/fonts/NotoSerif-Regular.ttf             assets/ui/visual_alpha/fonts/NotoSerif-SemiBold.ttf             assets/ui/visual_alpha/icons/check.svg             assets/ui/visual_alpha/icons/chevron_down.svg             assets/ui/visual_alpha/icons/status_diamond.svg
          do
            test -f "$asset"
            test -f "$asset.import"
          done
          echo "=== GENERATED IMPORT SIDECARS ==="
          find assets/ui/visual_alpha -type f -name '*.import' -print -exec cat {} \;
          echo "=== GENERATED SCRIPT UIDS ==="
          find scripts/ui/visual tests -type f -name '*.uid' -print -exec cat {} \; || true
          git diff --exit-code -- assets/ui/visual_alpha scripts/ui/visual tests/visual_foundation_tests.gd tests/visual_foundation_smoke.gd

      - name: Stage 7A targeted resource and scene checks
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$PWD/.tools/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --scene res://tests/visual_foundation_smoke.tscn 2>&1 | tee stage7a-targeted.log
          grep -q "STAGE 7A TARGETED PASSED" stage7a-targeted.log

      - name: Clean-import reproducibility
        if: contains(github.event.head_commit.message, 'Stage 7A checkpoint')
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .godot
          GODOT="$PWD/.tools/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --import 2>&1 | tee stage7a-clean-import.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error|Failed loading resource|Can't open" stage7a-clean-import.log; then
            echo "Clean re-import produced resource errors"
            exit 1
          fi
          git diff --exit-code -- assets/ui/visual_alpha scripts/ui/visual tests/visual_foundation_tests.gd tests/visual_foundation_smoke.gd
          status="$(git status --short --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi

      - name: Stage 7A checkpoint full regression
        if: contains(github.event.head_commit.message, 'Stage 7A checkpoint')
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$PWD/.tools/Godot_v4.7.2-stable_linux.x86_64" tests/run_tests.sh | tee stage7a-regression.log
          grep -q "All checks passed." stage7a-regression.log
