name: Stage 7E Collection

on:
  push:
    branches:
      - claude/odraveth-visual-alpha
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collection-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Clean checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fsSL "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o .tools/godot.zip
          curl -fsSL "$base/SHA512-SUMS.txt" -o .tools/SHA512-SUMS.txt
          (
            cd .tools
            grep "Godot_v4.7.2-stable_linux.x86_64.zip" SHA512-SUMS.txt | sed 's#Godot_v4.7.2-stable_linux.x86_64.zip#godot.zip#' | sha512sum -c -
            unzip -q godot.zip
            chmod +x Godot_v4.7.2-stable_linux.x86_64
          )
          .tools/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Fresh import
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .godot
          GODOT="$PWD/.tools/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --import 2>&1 | tee stage7e-import.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error|Failed loading resource|Can't open" stage7e-import.log; then
            echo "Fresh import produced errors"
            exit 1
          fi
          echo "=== STAGE 7E GENERATED UIDS ==="
          for path in             scripts/ui/collection_filter_state.gd.uid             scripts/ui/collection_archive_backdrop.gd.uid             tests/collection_v1_tests.gd.uid             tests/collection_v1_smoke.gd.uid
          do
            if [ -f "$path" ]; then
              echo "$path"
              cat "$path"
            fi
          done

      - name: Stage 7E targeted runtime checks
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$PWD/.tools/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --scene res://tests/collection_v1_smoke.tscn 2>&1 | tee stage7e-targeted.log
          grep -q "STAGE 7E TARGETED PASSED" stage7e-targeted.log

      - name: Stage 7D card presentation regression
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$PWD/.tools/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --scene res://tests/card_visual_system_smoke.tscn 2>&1 | tee stage7d-on-7e.log
          grep -q "STAGE 7D TARGETED PASSED" stage7d-on-7e.log

      - name: Checkpoint clean re-import
        if: contains(github.event.head_commit.message, 'Stage 7E checkpoint')
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .godot
          GODOT="$PWD/.tools/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --import 2>&1 | tee stage7e-clean-import.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error|Failed loading resource|Can't open" stage7e-clean-import.log; then
            echo "Clean re-import produced errors"
            exit 1
          fi
          status="$(git status --short --untracked-files=all)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi

      - name: Checkpoint full regression
        if: contains(github.event.head_commit.message, 'Stage 7E checkpoint')
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$PWD/.tools/Godot_v4.7.2-stable_linux.x86_64" tests/run_tests.sh | tee stage7e-regression.log
          grep -q "All checks passed." stage7e-regression.log
